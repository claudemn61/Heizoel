<style>
:root{
  --paper:#F1F4F3; --surface:#FFFFFF; --ink:#13262C; --muted:#586A70; --line:#D3DCDE; --soft:#E7EDED;
  --oil:#D48A00; --oil-ink:#7A4D00; --oil-soft:#F6E4B8; --cold:#2B6D8C; --ok:#2B7A56; --warn:#A86A00; --bad:#BC3828;
  --ok-bg:#DDF0E6; --warn-bg:#F9E8C4; --bad-bg:#F7DAD5;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A1E; --surface:#152429; --ink:#E7EEEF; --muted:#94A6AC; --line:#25404A; --soft:#1C323A;
    --oil:#F0A81E; --oil-ink:#F6CF7A; --oil-soft:#3B2D0C; --cold:#63B2D4; --ok:#52C28D; --warn:#EDB04C; --bad:#F07A68;
    --ok-bg:#16382B; --warn-bg:#3A2D10; --bad-bg:#432019; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A1E; --surface:#152429; --ink:#E7EEEF; --muted:#94A6AC; --line:#25404A; --soft:#1C323A;
  --oil:#F0A81E; --oil-ink:#F6CF7A; --oil-soft:#3B2D0C; --cold:#63B2D4; --ok:#52C28D; --warn:#EDB04C; --bad:#F07A68;
  --ok-bg:#16382B; --warn-bg:#3A2D10; --bad-bg:#432019; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,.big,.num{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;letter-spacing:-.01em}
h1{font-size:26px;margin:0;font-weight:700;line-height:1.1}
h2{font-size:19px;margin:0 0 4px;font-weight:650;line-height:1.2}
h3{font-size:15px;margin:0 0 6px;font-weight:650}
p{margin:0 0 8px}
.muted{color:var(--muted)}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 14px}

.chip.err i{background:var(--bad)} .chip.loc i{background:var(--warn)}

.card.flat{background:transparent;border-style:dashed}
.hero{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center;padding:18px 16px}
.gauge svg{display:block;width:104px;height:auto}

.status-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

.sheet.open{display:flex}

<script>
/* ===== Kernlogik (testbar, ohne DOM) ===== */
const DAY = 86400000;
const pad = n => String(n).padStart(2, '0');
const D = {
  parse(s){ const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d); },
  iso(t){ const d = new Date(t); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); },
  today(){ const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); }
};
const PRIOR = [19, 11, 8.5, 6, 4.5, 2.2, 1.9, 1.9, 3.8, 7.7, 12, 17.6];
const DEFAULTS = { thr:1000, reserve:500, lead:28, buffer:14, capacity:6000, seasonEnd:'05-31', price:170,
  mild:0.85, kalt:1.2, kMode:'auto', kManual:1.0, profile:PRIOR.slice() };

function dim(m, y){ return new Date(Date.UTC(y, m+1, 0)).getUTCDate(); }
function baseRate(profile, t){
  const d = new Date(t), y = d.getUTCFullYear(), m = d.getUTCMonth(), day = d.getUTCDate();
  let a, b, f;
  if (day >= 15){ a = m; b = (m+1) % 12; f = (day-15) / dim(m, y); }
  else { const pm = (m+11) % 12, py = m === 0 ? y-1 : y; a = pm; b = m; f = (day-15+dim(pm, py)) / dim(pm, py); }
  return profile[a]*(1-f) + profile[b]*f;
}
function consumption(t1, t2, mult, profile){
  let s = 0; for (let t = t1; t < t2; t += DAY) s += baseRate(profile, t) * mult; return s;
}

/* Ereignisse -> Punkte */
function buildPoints(events){
  const evs = events.slice().sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.type === 'read' ? -1 : 1));
  const pts = [];
  for (const e of evs){
    const t = D.parse(e.date);
    if (e.type === 'read') pts.push({t, level:e.level, kind:'read', ev:e});
    else {
      if (e.before != null) pts.push({t, level:e.before, kind:'pre', ev:e});
      pts.push({t, level:e.after, kind:'post', ev:e, unknownBefore: e.before == null});
    }
  }
  return pts;
}
function buildIntervals(pts){
  const iv = [];
  for (let i = 1; i < pts.length; i++){
    const p = pts[i-1], q = pts[i];
    if (q.kind === 'post') continue;            // Auffüllung bzw. Lücke vor Lieferung ohne Restbestand
    const days = (q.t - p.t) / DAY;
    if (days <= 0) continue;
    const litres = p.level - q.level;
    iv.push({t1:p.t, t2:q.t, days, litres, rate:litres/days, startLevel:p.level, endLevel:q.level, ev:q.ev,
      flag:{neg:litres < 0, high:litres/days > 30, short:days < 7}});
  }
  return iv;
}
/* Zyklen (zwischen Lieferungen) für Fit & Statistik */
function buildRuns(pts){
  const runs = []; let cur = null;
  for (let i = 0; i < pts.length; i++){
    const p = pts[i];
    if (p.kind === 'post'){ cur = [p]; runs.push(cur); }
    else if (cur) cur.push(p); else { cur = [p]; runs.push(cur); }
  }
  return runs;
}
/* Mess-Segmente: >= minDays lang, Ausreisser (>30 l/Tag) mit Vorgänger zusammengelegt */
function buildSegments(pts, minDays = 14){
  const segs = [];
  for (const run of buildRuns(pts)){
    const pp = run.filter(p => p.kind !== 'post' || p === run[0]);
    let list = [];
    let i = 0;
    while (i < pp.length - 1){
      let j = i + 1;
      while (j < pp.length - 1 && (pp[j].t - pp[i].t) / DAY < minDays) j++;
      list.push({t1:pp[i].t, t2:pp[j].t, litres:pp[i].level - pp[j].level});
      i = j;
    }
    // zu kurze Reste hinten an Vorgänger hängen
    if (list.length > 1){
      const last = list[list.length-1];
      if ((last.t2 - last.t1)/DAY < minDays){ const prev = list[list.length-2]; prev.t2 = last.t2; prev.litres += last.litres; list.pop(); }
    }
    // Ausreisser zusammenlegen
    for (let k = list.length - 1; k > 0; k--){
      const s = list[k], d = (s.t2 - s.t1)/DAY;
      if (s.litres/d > 30 || s.litres < 0){ const p = list[k-1]; p.t2 = s.t2; p.litres += s.litres; list.splice(k,1); }
    }
    for (const s of list){ s.days = (s.t2 - s.t1)/DAY; s.rate = s.litres/s.days; segs.push(s); }
  }
  return segs;
}
function fitK(segs, profile, now){
  let num = 0, den = 0;
  for (const s of segs){
    if (s.days < 7 || s.litres <= 0) continue;
    const M = consumption(s.t1, s.t2, 1, profile);
    const age = Math.max(0, (now - s.t2) / DAY);
    const w = Math.exp(-age / 730);
    num += w * s.litres; den += w * M;
  }
  return den > 0 ? num / den : 1;
}
function simulate(t0, L0, opt){
  const {mult, profile, delivery, until} = opt;
  const out = [{t:t0, level:L0}]; let L = L0;
  for (let t = t0; t < until; t += DAY){
    if (delivery && t === delivery.t) L = Math.min(delivery.cap, L + delivery.vol);
    L = Math.max(0, L - baseRate(profile, t) * mult);
    out.push({t:t+DAY, level:L});
  }
  return out;
}
function crossing(series, thr){ for (const p of series) if (p.level <= thr) return p.t; return null; }
function levelAt(series, t){
  if (t <= series[0].t) return series[0].level;
  for (let i = 1; i < series.length; i++) if (series[i].t >= t){
    const a = series[i-1], b = series[i], f = (t - a.t) / (b.t - a.t); return a.level + (b.level - a.level) * f; }
  return series[series.length-1].level;
}
function seasonEndAfter(ref, mmdd){
  const [mm, dd] = mmdd.split('-').map(Number);
  let y = new Date(ref).getUTCFullYear();
  let t = Date.UTC(y, mm-1, dd);
  if (t <= ref + 30*DAY) t = Date.UTC(y+1, mm-1, dd);
  return t;
}
/* Gesamtanalyse */
function analyze(events, settings, today){
  const S = Object.assign({}, DEFAULTS, settings || {});
  const pts = buildPoints(events);
  if (!pts.length) return {empty:true, S};
  const intervals = buildIntervals(pts);
  const segs = buildSegments(pts);
  const kAuto = fitK(segs, S.profile, today);
  const k = S.kMode === 'manual' ? S.kManual : kAuto;
  const last = pts[pts.length-1];
  const t0 = last.t, L0 = last.level;
  const horizon = Math.max(today, t0) + 560*DAY;
  const mk = m => simulate(t0, L0, {mult:k*m, profile:S.profile, until:horizon});
  const normal = mk(1), mild = mk(S.mild), kalt = mk(S.kalt);
  const estNow = levelAt(normal, today);
  const c = {
    thr:{normal:crossing(normal,S.thr), mild:crossing(mild,S.thr), kalt:crossing(kalt,S.thr)},
    reserve:{normal:crossing(normal,S.reserve), mild:crossing(mild,S.reserve), kalt:crossing(kalt,S.reserve)},
    empty:{normal:crossing(normal,0.5), mild:crossing(mild,0.5), kalt:crossing(kalt,0.5)}
  };
  const deadline = c.reserve.kalt != null ? c.reserve.kalt - S.lead*DAY : null;
  const recommended = deadline != null ? deadline - S.buffer*DAY : null;
  const T = seasonEndAfter(today, S.seasonEnd);
  const needN = consumption(t0, T, k, S.profile) + S.reserve - L0;
  const needK = consumption(t0, T, k*S.kalt, S.profile) + S.reserve - L0;
  const up = x => Math.max(0, Math.ceil(x/100)*100);
  return {S, pts, intervals, segs, kAuto, k, t0, L0, normal, mild, kalt, estNow, c, deadline, recommended, T,
          qtyMin: up(needN), qtySafe: up(needK), horizon};
}

function collect(p, type){
  const date = $('#' + p + '-date').value, cap = state.settings.capacity;
  if (!date) return {err:'Bitte ein Datum wählen.'};
  if (type === 'read'){
    const level = num($('#' + p + '-level').value);
    if (level == null || level < 0) return {err:'Bitte den Ölstand in Litern eingeben.'};
    const info = readInfo(date, level, p === 'x' && ui.sheet ? ui.sheet : null);
    return {ev:{type:'read', date, level:Math.round(level)}, warn:info.warn ? info.text : null};
  }
  let b = num($('#' + p + '-before').value), v = num($('#' + p + '-vol').value), a = num($('#' + p + '-after').value);
  if (a == null && b != null && v != null) a = b + v;
  if (a == null || a <= 0) return {err:'Bitte Gesamtbestand oder Restbestand und Menge eingeben.'};
  if (b == null && v != null) b = a - v;
  if (b != null && (b < 0 || a < b)) return {err:'Der Gesamtbestand darf nicht kleiner sein als der Restbestand.'};
  return {ev:{type:'fill', date, before:b == null ? null : Math.round(b), after:Math.round(a), vol:b == null ? null : Math.round(a - b)}, warn:a > cap ? `Der Gesamtbestand liegt über der Tankgrösse (${fN(cap)} l).` : null};
}
function renderAdd(){
  const m = ui.addMode, last = state.events.length ? state.events.slice().sort((a, b) => a.date < b.date ? 1 : -1)[0] : null;
  return `<div class="seg"><button data-mode="read" aria-pressed="${m === 'read'}">Ölstand ablesen</button><button data-mode="fill" aria-pressed="${m === 'fill'}">Lieferung</button></div>
  <section class="card"><h2>${m === 'read' ? 'Neuer Ölstand' : 'Neue Lieferung'}</h2><div id="addForm">${formHtml('a', m)}</div>
  <button class="btn oil" id="addSave">${m === 'read' ? 'Ölstand speichern' : 'Lieferung speichern'}</button></section>
  ${last ? `<p class="muted small">Letzter Eintrag: ${last.type === 'read' ? 'Ölstand ' + fN(last.level) + ' l' : 'Lieferung, Gesamtbestand ' + fN(last.after) + ' l'} am ${fD(D.parse(last.date))}.</p>` : ''}`;

/* ---- Verlauf ---- */
function renderLog(){
  if (!state.events.length) return emptyState();
  const evs = state.events.slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.type === 'fill' ? -1 : 1));
  const items = evs.map(e => {
    const iv = A.intervals.find(i => i.ev && i.ev.id === e.id);
    let meta = '', cls = '';
    if (iv){
      meta = `Verbrauch ${fN(iv.litres)} l in ${Math.round(iv.days)} Tagen · ${f1(iv.rate)} l/Tag`;
      if (iv.flag.neg){ cls = 'flag'; meta = `Stand ${fN(-iv.litres)} l höher als zuvor. Fehlt eine Lieferung?`; }
      else if (iv.flag.high){ cls = 'flag'; meta += ' · auffällig hoch, Ablesung prüfen'; }
      else if (iv.flag.short){ cls = 'soft'; meta += ' · kurzes Intervall, ungenau'; }
    } else if (e.type === 'read') meta = 'Verbrauch nicht berechenbar (kein vorheriger Stand)';
    if (e.type === 'fill'){
      const f = (e.vol != null ? `Geliefert ${fN(e.vol)} l` : 'Liefermenge unbekannt') + (e.before != null ? `, Restbestand ${fN(e.before)} l` : ', Restbestand unbekannt');
      meta = f + (iv ? ' · davor ' + f1(iv.rate) + ' l/Tag' : '');
      if (iv && iv.flag.neg) cls = 'flag';
    }
    return `<li data-id="${e.id}"><span class="ic ${e.type}">${e.type === 'fill' ? ICON.truck : ICON.drop}</span>
      <span class="t">${fD(D.parse(e.date))}${e.type === 'fill' ? ' · Lieferung' : ''}</span><span class="v">${e.type === 'read' ? fN(e.level) + ' l' : '→ ' + fN(e.after) + ' l'}</span>
      <span class="m ${cls}">${esc(meta)}</span></li>`;
  }).join('');
  return `<h2 style="margin:0 0 10px">Verlauf</h2><ul class="log">${items}</ul><p class="muted small">Tippe auf einen Eintrag, um ihn zu ändern oder zu löschen.</p>`;
}

const DIM = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
function cyclesTable(){
  const runs = buildRuns(A.pts).filter(r => r.length >= 2);
  const rows = runs.map((r, i) => {
    const s = r[0], e = r[r.length - 1], days = (e.t - s.t) / DAY, lit = s.level - e.level;
    if (days <= 0) return '';
    const ongoing = i === runs.length - 1;
    const yr = days >= 330 ? fN(lit / days * 365) : '–';
    return `<tr><td>${fDs(s.t)}${ongoing ? ' (läuft)' : ''}</td><td>${Math.round(days)}</td><td>${fN(lit)}</td><td>${f1(lit / days)}</td><td>${yr}</td></tr>`;
  }).reverse().join('');
  return `<div class="scroll"><table class="cyc"><thead><tr><th>Ab Lieferung</th><th>Tage</th><th>Liter</th><th>l/Tag</th><th>l/Jahr</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderAnalysis(){
  if (A.empty) return emptyState();
  const yearTotal = A.S.profile.reduce((s, v, i) => s + v * DIM[i], 0) * A.k;
  return `<section class="card"><h2>Verbrauch pro Tag</h2><p class="muted small">Jedes Messintervall als Balken, die Linie zeigt das Modell.</p><div class="chart" id="chartRate"></div></section>
  <section class="card"><h2>Verbrauch pro Monat</h2><p class="muted small">Modell in Litern, zusammen ${fN(yearTotal)} l pro Jahr. Punkte sind Messungen aus Intervallen von 14 bis 70 Tagen.</p><div class="chart" id="chartMonth"></div></section>
  <section class="card"><h2>Heizzyklen</h2>${cyclesTable()}<p class="muted small" style="margin-top:8px">Ein Zyklus läuft von einer Lieferung bis zur nächsten. Die Jahreswerte erscheinen ab 330 Tagen Dauer.</p></section>
  <section class="card"><h3>So rechnet die App</h3><p class="small muted">Ein Monatsprofil (l/Tag je Monat) bildet das typische Heizjahr ab. Ein Faktor passt es an deinen Verbrauch an. Aktuell ist er <b>${A.k.toFixed(2)}</b>${A.S.kMode === 'manual' ? ' (manuell gesetzt, automatisch wären ' + A.kAuto.toFixed(2) + ')' : ' (aus deinen Messungen berechnet, neuere Messungen zählen stärker)'}. Ausreisser über 30 l/Tag werden mit dem vorherigen Intervall zusammengelegt. Der kalte Winter rechnet mit +${Math.round((A.S.kalt - 1) * 100)} %, der milde mit −${Math.round((1 - A.S.mild) * 100)} %.</p></section>`;
}

const SVGNS = 'http://www.w3.org/2000/svg';
/* Zeitachse: Abstand der Beschriftungen nach verfügbarer Breite (pw = Plotbreite in px) */
function timeTicks(x0, x1, pw){
  const span = (x1 - x0) / DAY, pxDay = pw / Math.max(1, span), MIN = 38, out = [];
  if (span <= 900){
    const step = [1, 2, 3, 6].find(n => n * 30.4 * pxDay >= MIN) || 6;
    const d = new Date(x0); let y = d.getUTCFullYear(), m = d.getUTCMonth() + 1;
    if (m > 11){ m = 0; y++; }
    for (let t = Date.UTC(y, m, 1); t <= x1; m++, t = Date.UTC(y, m, 1)){
      const mo = new Date(t).getUTCMonth();
      if (mo % step === 0) out.push({t, mo, yr:new Date(t).getUTCFullYear()});
    }
    return out.map((k, i) => ({t:k.t, label:MON[k.mo] + ((k.mo === 0 || i === 0) ? ' ' + String(k.yr).slice(2) : '')}));
  }
  const step = [1, 2, 5, 10].find(n => n * 365.25 * pxDay >= MIN) || 10;
  for (let y = new Date(x0).getUTCFullYear(); y <= new Date(x1).getUTCFullYear(); y++){
    const t = Date.UTC(y, 0, 1);
    if (t >= x0 && t <= x1 && y % step === 0) out.push({t, label:String(y)});
  }
  return out;
}
function pathOf(series, X, Y, x1){
  let s = '', first = true;
  for (const p of series){ if (p.t > x1 + DAY) break; s += (first ? 'M' : 'L') + X(p.t).toFixed(1) + ',' + Y(p.level).toFixed(1); first = false; }
  return s;
}
function setupTip(host, svg, m, W, H, x0, x1, tipFn){
  const tip = document.createElement('div'); tip.className = 'tip'; host.appendChild(tip);
  const cur = svg.querySelector('#cursor');
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = ev.clientX - r.left;
    if (px < m.l || px > W - m.r){ tip.style.display = 'none'; if (cur) cur.setAttribute('opacity', 0); return; }
    const t = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    const html = tipFn(t); if (!html){ tip.style.display = 'none'; return; }
    tip.innerHTML = html; tip.style.display = 'block';
    const tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(W - tw, px - tw / 2)) + 'px'; tip.style.top = '2px';
    if (cur){ cur.setAttribute('x1', px); cur.setAttribute('x2', px); cur.setAttribute('opacity', .5); }
  };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; if (cur) cur.setAttribute('opacity', 0); });
}
function histLevel(t){
  const pts = A.pts;
  if (t < pts[0].t || t > pts[pts.length - 1].t) return null;
  for (let i = 1; i < pts.length; i++){
    if (pts[i].t >= t){
      const a = pts[i - 1], b = pts[i];
      if (b.kind === 'post') return b.t === t ? b.level : a.level;
      if (b.t === a.t) return b.level;
      return a.level + (b.level - a.level) * (t - a.t) / (b.t - a.t);
    }
  }
  return null;
}

  const pending = imp ? `<div class="preview warn" style="margin-top:10px">Datei mit <b>${imp.events.length} Einträgen</b> geladen${impLast ? ', letzter vom ' + fD(D.parse(impLast)) : ''}. Beim Übernehmen werden alle vorhandenen Einträge und Einstellungen ersetzt.</div>
    <div class="btns"><button class="btn oil sm" data-act="import">Übernehmen</button><button class="btn ghost sm" data-act="importCancel">Abbrechen</button></div>` : '';
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  const install = (!window.claude && !standalone) ? `<section class="card"><h3>Als App installieren</h3><p class="small muted">iPhone: In Safari auf das Teilen-Symbol tippen, dann «Zum Home-Bildschirm». Android: Browsermenü, dann «App installieren». Danach läuft die App im Vollbild und auch ohne Internet.</p>${deferredPrompt ? '<div class="btns"><button class="btn oil sm" data-act="install">Jetzt installieren</button></div>' : ''}</section>` : '';
  const where = storageMode === 'db' ? 'in deinem Claude-Konto und sind auf allen Geräten verfügbar' : (!window.claude ? 'auf diesem Gerät im Speicher der App. Sichere sie regelmässig, denn beim Löschen der App-Daten gehen sie verloren' : 'nur in diesem Browser. Öffne die App eingeloggt in Claude, damit sie im Konto gespeichert werden');
  return `<h2 style="margin:0 0 10px">Einstellungen</h2>
  <section class="card" id="settings"><h3>Bestelltermin</h3>
    <div class="row2">${num_('thr', 'Schwelle (l)', 'Dieser Stand wird als Termin angezeigt.')}${num_('reserve', 'Reserve (l)', 'Soll am Ende bleiben.')}</div>
    <div class="row2">${num_('lead', 'Lieferfrist (Tage)', 'Vom Auftrag bis zur Lieferung.')}${num_('buffer', 'Puffer (Tage)', 'Zusätzliche Sicherheit.')}</div>
    <h3 style="margin-top:8px">Tank und Preis</h3>
    <div class="row2">${num_('capacity', 'Tankgrösse (l)', '')}${num_('price', 'Preis (CHF/100 l)', 'Nur für die Kostenschätzung.')}</div>
    <label class="field"><span>Ende der Heizperiode</span><div class="row2"><select data-s="endm">${MON.map((m, i) => `<option value="${i + 1}" ${em === i + 1 ? 'selected' : ''}>${m}</option>`).join('')}</select><input data-s="endd" inputmode="numeric" value="${ed}"></div><small>Bis dahin wird die Bestellmenge berechnet.</small></label>
    <h3 style="margin-top:8px">Winter-Szenarien</h3>
    <div class="row2"><label class="field"><span>Kalter Winter (+ %)</span><input data-s="kaltPct" inputmode="numeric" value="${Math.round((S.kalt - 1) * 100)}"></label>
    <label class="field"><span>Milder Winter (− %)</span><input data-s="mildPct" inputmode="numeric" value="${Math.round((1 - S.mild) * 100)}"></label></div>
    <h3 style="margin-top:8px">Verbrauchsfaktor</h3>
    <div class="row2"><label class="field"><span>Berechnung</span><select data-s="kMode"><option value="auto" ${S.kMode === 'auto' ? 'selected' : ''}>Automatisch (${A && !A.empty ? A.kAuto.toFixed(2) : '–'})</option><option value="manual" ${S.kMode === 'manual' ? 'selected' : ''}>Manuell</option></select></label>
    <label class="field"><span>Manueller Wert</span><input data-s="kManual" inputmode="decimal" value="${S.kManual}"></label></div>
    <details><summary>Monatsprofil anpassen (l/Tag)</summary><div class="mgrid">${S.profile.map((v, i) => `<div><label>${MON[i]}</label><input data-p="${i}" inputmode="decimal" value="${v}"></div>`).join('')}</div>
    <div class="btns"><button class="btn ghost sm" data-act="resetProfile">Standardprofil laden</button></div></details>
    <label class="field"><span>Darstellung</span><select data-s="theme"><option value="auto" ${S.theme === 'auto' ? 'selected' : ''}>Automatisch</option><option value="light" ${S.theme === 'light' ? 'selected' : ''}>Hell</option><option value="dark" ${S.theme === 'dark' ? 'selected' : ''}>Dunkel</option></select></label>
  </section>
  ${install}<section class="card"><h3>Sicherung</h3><p class="small muted">Deine Daten liegen ${where}. Die Sicherungsdatei z. B. in «Dateien» oder iCloud Drive ablegen.</p>
    <div class="btns"><button class="btn ghost sm" data-act="download">Als Datei speichern</button><button class="btn ghost sm" data-act="pick">Datei laden</button></div>
    <input type="file" id="impFile" accept="application/json,.json" hidden>${pending || '<p class="hint" style="margin-top:6px">Das Laden ersetzt alle vorhandenen Einträge.</p>'}</section>
  <section class="card"><h3>Alle Daten löschen</h3><p class="small muted">Entfernt alle Einträge und Einstellungen.</p>
    <div class="btns"><button class="btn ${ui.resetArm ? 'bad' : 'ghost'} sm" data-act="reset">${ui.resetArm ? 'Ja, alles löschen' : 'Daten löschen'}</button></div></section>`;
}

/* ---- Sheet (Eintrag bearbeiten) ---- */
function openSheet(id){
  const e = state.events.find(x => x.id === id); if (!e) return;
  ui.sheet = id; ui.delArm = false; ui.confirmKey = null;
  const sh = $('#sheet');
  sh.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="Eintrag bearbeiten"><h2>${e.type === 'read' ? 'Ölstand ändern' : 'Lieferung ändern'}</h2>
    <div id="xForm">${formHtml('x', e.type, e.type === 'read' ? {date:e.date, level:e.level} : {date:e.date, before:e.before, vol:e.vol, after:e.after})}</div>
    <button class="btn oil" id="xSave">Änderung speichern</button>
    <div class="btns"><button class="btn ghost" id="xCancel">Abbrechen</button><button class="btn ghost" id="xDel">Löschen</button></div></div>`;
  sh.classList.add('open');
  wireForm('x', e.type, id, () => { const b = $('#xSave'); if (b) b.textContent = 'Änderung speichern'; });
}
function closeSheet(){ ui.sheet = null; $('#sheet').classList.remove('open'); $('#sheet').innerHTML = ''; }

/* ---- Rendering ---- */
function render(){
  TODAY = D.today();
  A = analyze(state.events, state.settings, TODAY);
  applyTheme();
  $$('.bottom button').forEach(b => b.getAttribute('data-tab') === ui.tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  const main = $('#main');
  main.innerHTML = ui.tab === 'home' ? renderHome() : ui.tab === 'add' ? renderAdd() : ui.tab === 'log' ? renderLog() : ui.tab === 'analysis' ? renderAnalysis() : renderMore();
  if (ui.tab === 'add'){
    const base = ui.addMode === 'read' ? 'Ölstand speichern' : 'Lieferung speichern';
    wireForm('a', ui.addMode, null, () => { const b = $('#addSave'); if (b) b.textContent = base; });
  }
  renderChip();
  requestAnimationFrame(drawCharts);
}
function go(tab){ ui.tab = tab; ui.resetArm = false; ui.importData = null; render(); window.scrollTo(0, 0); }

/* ---- Aktionen ---- */
function onAddSave(){
  const r = collect('a', ui.addMode);
  if (r.err){ toast(r.err); return; }
  const key = JSON.stringify(r.ev);
  if (r.warn && ui.confirmKey !== key){ ui.confirmKey = key; $('#addSave').textContent = 'Trotzdem speichern'; toast('Bitte den Hinweis prüfen und nochmals tippen.'); return; }
  addEvent(r.ev); ui.confirmKey = null; ui.planVol = null; ui.planDate = null;
  toast(ui.addMode === 'read' ? 'Ölstand gespeichert' : 'Lieferung gespeichert'); go('home');
}
function onSheetSave(){
  const e = state.events.find(x => x.id === ui.sheet); if (!e) return;
  const r = collect('x', e.type);
  if (r.err){ toast(r.err); return; }
  const key = JSON.stringify(r.ev);
  if (r.warn && ui.confirmKey !== key){ ui.confirmKey = key; $('#xSave').textContent = 'Trotzdem speichern'; toast('Bitte den Hinweis prüfen und nochmals tippen.'); return; }
  updateEvent(e.id, r.ev); closeSheet(); ui.planVol = null; ui.planDate = null; toast('Änderung gespeichert'); render();
}
function onSheetDelete(){
  if (!ui.delArm){ ui.delArm = true; const b = $('#xDel'); b.textContent = 'Wirklich löschen'; b.classList.remove('ghost'); b.classList.add('bad'); return; }
  deleteEvent(ui.sheet); closeSheet(); ui.planVol = null; ui.planDate = null; toast('Eintrag gelöscht'); render();
}
function onSetting(t){
  const S = state.settings, k = t.dataset.s;
  if (t.dataset.p != null){ const v = num(t.value); if (v != null && v >= 0) S.profile[+t.dataset.p] = v; }
  else if (['thr', 'reserve', 'lead', 'buffer', 'capacity', 'price'].includes(k)){ const v = num(t.value); if (v != null && v >= 0) S[k] = v; }
  else if (k === 'kaltPct'){ const v = num(t.value); if (v != null && v >= 0 && v <= 100) S.kalt = 1 + v / 100; }
  else if (k === 'mildPct'){ const v = num(t.value); if (v != null && v >= 0 && v <= 60) S.mild = 1 - v / 100; }
  else if (k === 'kManual'){ const v = num(t.value); if (v != null && v > 0 && v < 5) S.kManual = v; }
  else if (k === 'kMode' || k === 'theme'){ S[k] = t.value; if (k === 'kMode' && t.value === 'manual' && A && !A.empty && S.kManual === 1) S.kManual = Math.round(A.kAuto * 100) / 100; }
  else if (k === 'endm' || k === 'endd'){
    let [m, d] = S.seasonEnd.split('-').map(Number);
    if (k === 'endm') m = +t.value; else { const v = num(t.value); if (v != null) d = Math.max(1, Math.min(31, Math.round(v))); }
    S.seasonEnd = pad(m) + '-' + pad(d);
  } else return;
  persist(); ui.planVol = null; ui.planDate = null; render();
}
async function onAct(act){
  if (act === 'download'){
    const data = JSON.stringify({v:1, events:state.events, settings:state.settings}, null, 1), fname = 'heizoel-daten-' + D.iso(TODAY) + '.json';
    try {
      const dl = window.claude && claude.use ? await claude.use('downloads') : null;
      if (dl){ await dl.save({filename:fname, data}); toast('Datei gespeichert'); }
      else { const url = URL.createObjectURL(new Blob([data], {type:'application/json'})); const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Datei wird gespeichert'); }
    } catch(e){ toast('Speichern abgebrochen.'); }
  } else if (act === 'install'){
    if (deferredPrompt){ deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch(e){} deferredPrompt = null; render(); }
  } else if (act === 'pick'){
    const f = $('#impFile'); f.value = ''; f.click();
  } else if (act === 'import'){
    if (!ui.importData) return;
    state = normalize(ui.importData); persist(); ui.importData = null; ui.planVol = null; ui.planDate = null; toast('Daten übernommen'); render();
  } else if (act === 'importCancel'){
    ui.importData = null; render();
  } else if (act === 'reset'){
    if (!ui.resetArm){ ui.resetArm = true; render(); return; }
    state = normalize({events:[], settings:{}}); persist(); ui.resetArm = false; ui.planVol = null; ui.planDate = null; toast('Alle Daten gelöscht'); render();
  } else if (act === 'resetProfile'){ state.settings.profile = PRIOR.slice(); persist(); render(); }
}

/* ---- Ereignisse ---- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, li[data-id]'); if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.mode){ ui.addMode = t.dataset.mode; ui.confirmKey = null; return render(); }
  if (t.dataset.range){ ui.range = t.dataset.range; $$('#rangeChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.range === ui.range)); return drawLevel(); }
  if (t.dataset.act) return onAct(t.dataset.act);
  if (t.id === 'addSave') return onAddSave();
  if (t.id === 'xSave') return onSheetSave();
  if (t.id === 'xCancel') return closeSheet();
  if (t.id === 'xDel') return onSheetDelete();
  if (t.matches('li[data-id]')) return openSheet(t.dataset.id);
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
$('#main').addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'plan-vol'){ const v = num(t.value); ui.planVol = v == null ? 0 : Math.max(0, Math.round(v)); drawLevel(); updatePlanText(); }
  else if (t.id === 'plan-date'){ ui.planDate = t.value || null; drawLevel(); updatePlanText(); }
});
$('#main').addEventListener('change', e => {
  if (e.target.id === 'impFile') return onFile(e.target.files && e.target.files[0]);
  if (e.target.closest('#settings')) onSetting(e.target);
});
/* Sicherungsdatei lesen und zur Bestätigung anzeigen */
async function onFile(file){
  if (!file) return;
  let d; try { d = JSON.parse(await file.text()); } catch(e){ toast('Die Datei ist keine gültige Sicherung.'); return; }
  if (!d || !Array.isArray(d.events)){ toast('In der Datei fehlen die Einträge.'); return; }
  ui.importData = d; render();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (ui.tab === 'more') render(); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });

/* ---- Start ---- */
const loc = loadLocal() || window.HEIZOEL_SEED || null; if (loc){ state = normalize(loc); saveLocal(); }
render();
initDb();
})();
</script><script>
if ('serviceWorker' in navigator && location.protocol !== 'file:'){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
if (navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }
</script></body></html>
